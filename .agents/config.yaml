docs_root: app/views/docs/markdown              # public product docs served at /docs
rule_docs:
  - AGENTS.md                                   # local run on the snapshot, test harness, gate
  - .github/copilot-instructions.md
checkpoint_cmd: "bin/gate"                      # standalone tests + RSpec on fresh test clones
package_test_cmd: "bundle exec rspec {files}"   # spec/ files; test/ files run with: ruby -Itest {files}
