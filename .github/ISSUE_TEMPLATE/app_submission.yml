name: "Submit your app"
description: "Built an app, library or tool with QUL data? Ask us to list it in the apps directory."
labels: ["app-submission"]
body:
  - type: markdown
    attributes:
      value: |
        The apps directory (https://qul.tarteel.ai/apps) lists apps whose use of QUL is public: their site, store page, README or credits screen names QUL. We check each submission before it is listed.

  - type: input
    id: app_name
    attributes:
      label: "App name"
    validations:
      required: true

  - type: input
    id: app_link
    attributes:
      label: "Link"
      description: "The app's store page, website or code repository."
    validations:
      required: true

  - type: checkboxes
    id: platforms
    attributes:
      label: "Platforms"
      options:
        - label: "iOS"
        - label: "Android"
        - label: "Web"
        - label: "Desktop"
        - label: "Library"
        - label: "Tool"
        - label: "Dataset"

  - type: checkboxes
    id: resources_used
    attributes:
      label: "QUL resources it uses"
      options:
        - label: "Recitations"
        - label: "Mushaf layouts"
        - label: "Quran scripts"
        - label: "Fonts"
        - label: "Translations"
        - label: "Transliterations"
        - label: "Tafsirs"
        - label: "Surah info"
        - label: "Morphology and grammar"
        - label: "Mutashabihat"
        - label: "Similar ayahs"
        - label: "Ayah topics"
        - label: "Ayah themes"
        - label: "Quran metadata"

  - type: textarea
    id: description
    attributes:
      label: "What does it do?"
      description: "One or two sentences for the directory."
    validations:
      required: true

  - type: input
    id: credit_link
    attributes:
      label: "Where it credits QUL"
      description: "A public link: a README, credits screen, about page or the code that uses QUL data."
    validations:
      required: true

  - type: input
    id: icon_link
    attributes:
      label: "Icon"
      description: "A link to a square icon, if the store page does not have one."

  - type: checkboxes
    id: consent
    attributes:
      label: "Listing"
      options:
        - label: "QUL may list and feature this app on qul.tarteel.ai, with its name, icon, description and link."
          required: true
