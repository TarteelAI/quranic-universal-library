name: Deploy

on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          push: true
          tags: |
            tarteel/quranic-universal-library:${{ github.sha }}
            tarteel/quranic-universal-library:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions: {}
    steps:
      - name: Rollout
        env:
          KUBECONFIG_B64: ${{ secrets.KUBECONFIG_DEPLOY_QUL }}
          SHA: ${{ github.sha }}
        run: |
          mkdir -p $HOME/.kube
          echo "$KUBECONFIG_B64" | base64 -d > $HOME/.kube/config
          chmod 600 $HOME/.kube/config
          IMAGE="tarteel/quranic-universal-library:$SHA"
          kubectl set image deployment/quranic-universal-library \
            quranic-universal-library="$IMAGE" \
            -n tarteel-deployments
          kubectl rollout status deployment/quranic-universal-library \
            -n tarteel-deployments --timeout=5m
