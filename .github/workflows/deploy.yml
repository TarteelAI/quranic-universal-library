name: Deploy

# Builds and signs main; TarteelAI/infra deploys only images this workflow signed on main.
on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    timeout-minutes: 15
    outputs:
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        id: build
        with:
          push: true
          tags: |
            tarteel/quranic-universal-library:${{ github.sha }}
            tarteel/quranic-universal-library:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    # Holds the infra App key; only main can use it.
    environment: production
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3
        with:
          cosign-release: "v3.1.4"

      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Sign
        env:
          IMAGE: tarteel/quranic-universal-library
          DIGEST: ${{ needs.build.outputs.digest }}
          RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
          SHA: ${{ github.sha }}
          ACTOR: ${{ github.actor }}
        run: |
          cosign sign --yes -a "run_id=$RUN_ID" -a "run_attempt=$RUN_ATTEMPT" -a "sha=$SHA" -a "actor=$ACTOR" \
            "$IMAGE@$DIGEST"

      - name: Token for infra
        id: app
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ vars.INFRA_PROMOTE_APP_CLIENT_ID }}
          private-key: ${{ secrets.INFRA_PROMOTE_APP_KEY }}
          owner: TarteelAI
          repositories: infra
          permission-actions: write

      - name: Deploy
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          DIGEST: ${{ needs.build.outputs.digest }}
          TAG: ${{ github.sha }}
        run: |
          gh workflow run flux-promote.yml -R TarteelAI/infra --ref main \
            -f image=tarteel/quranic-universal-library -f tag="$TAG" -f digest="$DIGEST" -f deployment=quranic-universal-library \
            -f repo="$GITHUB_REPOSITORY" -f run_id="$GITHUB_RUN_ID" -f run_attempt="$GITHUB_RUN_ATTEMPT"
          export TITLE="promote quranic-universal-library for $GITHUB_REPOSITORY run $GITHUB_RUN_ID/$GITHUB_RUN_ATTEMPT"
          for _ in $(seq 30); do
            sleep 5
            id="$(gh run list -R TarteelAI/infra -w flux-promote.yml -e workflow_dispatch -L 50 \
              --json databaseId,displayTitle --jq 'map(select(.displayTitle == env.TITLE))[0].databaseId // empty')"
            [[ -n "$id" ]] && break
          done
          [[ -n "$id" ]] || { echo "::error::The deploy did not start"; exit 1; }
          deadline=$((SECONDS + 2700))
          until [[ "$(gh run view "$id" -R TarteelAI/infra --json status --jq .status)" == completed ]]; do
            (( SECONDS < deadline )) || { echo "::error::The deploy is still running after 45 min"; exit 1; }
            sleep 20
          done
          conclusion="$(gh run view "$id" -R TarteelAI/infra --json conclusion --jq .conclusion)"
          echo "Deploy: $conclusion" >> "$GITHUB_STEP_SUMMARY"
          [[ "$conclusion" == success ]] || { echo "::error::The deploy finished with $conclusion"; exit 1; }
