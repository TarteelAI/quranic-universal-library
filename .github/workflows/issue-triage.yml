name: Issue triage

# Labels new issues from their form answers and posts a helpful comment.
# The rules live in .github/scripts/issue-triage.js.

on:
  issues:
    types: [opened]

permissions:
  contents: read
  issues: write

concurrency:
  group: issue-triage-${{ github.event.issue.number }}

jobs:
  triage:
    runs-on: ubuntu-24.04
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          sparse-checkout: .github

      - uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        with:
          script: |
            const triage = require('./.github/scripts/issue-triage.js');
            await triage.run({ github, context, core });
