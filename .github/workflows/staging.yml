name: Staging (qul-next)

# Builds qul-next and rolls it out to the qul-staging deployment, which runs on copies of the
# production databases. Never tags latest: deploy.yml owns that tag and production.
on:
  push:
    branches: [qul-next]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: staging
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - uses: docker/build-push-action@v7
        with:
          push: true
          tags: tarteel/quranic-universal-library:qul-next-${{ github.sha }}
          cache-from: type=gha,scope=staging
          cache-to: type=gha,mode=max,scope=staging

  deploy:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    # Holds KUBECONFIG_DEPLOY_QUL_STAGING; restricted to the qul-next branch.
    environment: staging
    permissions: {}
    steps:
      # The pod migrates before it serves: a failed migration fails the rollout and the old
      # pod stays up. This login can only set the image on qul-staging.
      - name: Rollout
        env:
          KUBECONFIG_B64: ${{ secrets.KUBECONFIG_DEPLOY_QUL_STAGING }}
          SHA: ${{ github.sha }}
        run: |
          mkdir -p "$HOME/.kube"
          echo "$KUBECONFIG_B64" | base64 -d > "$HOME/.kube/config"
          chmod 600 "$HOME/.kube/config"
          IMAGE="tarteel/quranic-universal-library:qul-next-$SHA"
          kubectl set image deployment/qul-staging qul-staging="$IMAGE" -n tarteel-deployments
          kubectl rollout status deployment/qul-staging -n tarteel-deployments --timeout=10m
