name: Tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  standalone:
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v6

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version-file: .ruby-version

      # The tests under test/ do not boot Rails and do not touch the database,
      # so they need neither bundler nor a Postgres service.
      - name: Install test dependencies
        run: gem install minitest activesupport csv rubyzip sqlite3 --no-document

      - name: Run tests
        run: ruby -Itest -e 'Dir["test/**/*_test.rb"].sort.each { |f| require File.expand_path(f) }'

  issue-triage:
    runs-on: ubuntu-24.04
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Run issue triage tests
        run: node --test .github/scripts/issue-triage.test.js
