# Apps, libraries and tools whose makers credit QUL in public: in their own code, README or
# credits screen (`evidence`). The /apps directory and the home page's showcase read this file
# through AppDirectory; spec/services/app_directory_spec.rb checks it.
#
# - `platforms`: keys of AppDirectory::PLATFORMS.
# - `uses`: the QUL resource types the app credits, as Catalog::Taxonomy type keys. The first one
#   tints the initials tile of an app without an icon.
# - `icon`: a file in public/app-icons (from the app's store listing, repo or site), else none.
# - `featured`: listed first. The four below are placeholders until the maintainers supply the list.
# - `kind`: a short noun for the home page's showcase.

# The apps on the home page, in this order.
showcase:
  - quranwbw
  - qurancaption
  - quran-library
  - quran-validator
  - mihrab
  - bayaan
  - al-quran-ios
  - quranic-universal-audio

apps:
  - id: quranwbw
    name: QuranWBW
    url: https://quranwbw.com
    icon: quranwbw.png
    platforms: [web]
    kind: Word by word
    description: Read, listen to and learn the Quran word by word, with translations in many languages.
    uses: [translation]
    evidence: https://github.com/marwan/quranwbw
    featured: true

  - id: qurancaption
    name: QuranCaption
    url: https://qurancaption.com
    icon: qurancaption.png
    platforms: [desktop]
    kind: Video captions
    description: Turn recitations into captioned videos with synced Arabic text and translations.
    uses: [translation]
    evidence: https://github.com/zonetecde/QuranCaption/blob/main/scripts/convert-saheehinternational-v2.js
    featured: true

  - id: quran-library
    name: quran_library
    url: https://pub.dev/packages/quran_library
