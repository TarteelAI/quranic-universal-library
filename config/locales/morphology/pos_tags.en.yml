# English part-of-speech terms are NoorBayan's own, taken verbatim from
# corpus/pos.csv (the `pos_en` column) in github.com/NoorBayan/Quranic, so the
# treebank labels match the published dataset. ATT, ELIDED and NV are not in
# that file and keep our own wording. The source spells INTG "Interogative";
# corrected here.
en:
  morphology:
    pos_tags:
      ACC: "Accusative particle"
      ADJ: "Adjective"
      AMD: "Amendment particle"
      ANS: "Answer particle"
      ATT: "Attention"
      AVR: "Aversion particle"
      CAUS: "Particle of cause"
      CERT: "Particle of certainty"
      CIRC: "Circumstantial particle"
      COM: "Comitative particle"
      COND: "Conditional particle"
      CONJ: "Coordinating conjunction"
      CS: "Conditional sentence"
      DEM: "Demonstrative pronoun"
      DET: "Determiner"
      ELIDED: "Elided"
      EMPH: "Emphatic lām prefix"
      EQ: "Equalization particle"
      EXH: "Exhortation particle"
      EXL: "Explanation particle"
      EXP: "Exceptive particle"
      FUT: "Future particle"
      IMPN: "Imperative verbal noun"
      IMPV: "Imperative lām prefix"
      INC: "Inceptive particle"
      INL: "Quranic initials"
      INT: "Particle of interpretation"
      INTG: "Interrogative particle"
      LOC: "Location adverb"
      N: "Noun"
      NEG: "Negative particle"
      NS: "Nominal sentence"
      NV: "Nominal Verb"
      P: "Preposition"
      PN: "Proper noun"
      PP: "Prepositional phrase"
      PREV: "Preventive particle"
      PRO: "Prohibition particle"
      PRON: "Personal pronoun"
      PRP: "Purpose lām prefix"
      REL: "Relative pronoun"
      REM: "Resumption particle"
      RES: "Restriction particle"
      RET: "Retraction particle"
      RSLT: "Result particle"
      S: "Sentence"
      SC: "Subordinate clause"
      SUB: "Subordinating conjunction"
      SUP: "Supplemental particle"
      SUR: "Surprise particle"
      T: "Time adverb"
      V: "Verb"
      VOC: "Vocative particle"
      VS: "Verbal sentence"
