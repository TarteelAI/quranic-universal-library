test:
  service: Disk
  root: <%= Rails.root.join("tmp/storage") %>

local:
  service: Disk
  root: <%= Rails.root.join("storage") %>

# Use rails credentials:edit to set the AWS secrets (as aws:access_key_id|secret_access_key)
# amazon:
#   service: S3
#   access_key_id: <%= Rails.application.credentials.dig(:aws, :access_key_id) %>
#   secret_access_key: <%= Rails.application.credentials.dig(:aws, :secret_access_key) %>
#   region: us-east-1
#   bucket: your_own_bucket

# Remember not to checkin your GCS keyfile to a repository
# google:
#   service: GCS
#   project: your_project
#   credentials: <%= Rails.root.join("path/to/gcs.keyfile") %>
#   bucket: your_own_bucket

# Use rails credentials:edit to set the Azure Storage secret (as azure_storage:storage_access_key)
# microsoft:
#   service: AzureStorage
#   storage_account_name: your_account_name
#   storage_access_key: <%= Rails.application.credentials.dig(:azure_storage, :storage_access_key) %>
#   container: your_container_name

# mirror:
#   service: Mirror
#   primary: local
#   mirrors: [ amazon, google, microsoft ]

# Public files. R2 serves a public bucket only on its own host, so links start at
# QUL_STORAGE_PUBLIC_HOST (or CDN_HOST); with neither set they are the S3 endpoint's
# (lib/active_storage/service/r2_service.rb).
qul_exports:
  service: R2
  access_key_id: "<%= ENV['QUL_STORAGE_ACCESS_KEY'].presence || 'missing' %>"
  secret_access_key: "<%= ENV['QUL_STORAGE_ACCESS_KEY_SECRET'].presence || 'missing' %>"
  region: "<%= ENV['QUL_STORAGE_REGION'].presence || 'us-east-1' %>"
  bucket: "<%= ENV['QUL_STORAGE_BUCKET'].presence || 'missing' %>"
  public: <%= ENV['QUL_STORAGE_PUBLIC_EXPORT'].presence || true %>
  endpoint: "<%= ENV['QUL_STORAGE_ENDPOINT'].presence || 'https://fix.me' %>"
  # R2 refuses an upload that carries the SDK's default CRC32 beside the Content-MD5 Rails
  # sends ("one non-default checksum at a time"), so the SDK adds one only where S3 needs it.
  request_checksum_calculation: when_required
  public_host: "<%= ENV['QUL_STORAGE_PUBLIC_HOST'].presence || ENV['CDN_HOST'] %>"
  upload:
    cache_control: "public, max-age=<%= 1.year.to_i %>"

# The production default service (config/environments/production.rb): private, in the
# same bucket as database_backups.
amazon_s3:
  service: S3
  access_key_id: "<%= ENV['QUL_STORAGE_ACCESS_KEY'].presence || 'missing' %>"
  secret_access_key: "<%= ENV['QUL_STORAGE_ACCESS_KEY_SECRET'].presence || 'missing' %>"
  region: "<%= ENV['QUL_STORAGE_REGION'].presence || 'us-east-1' %>"
  bucket: "<%= ENV['QUL_BACKUPS_BUCKET'].presence || 'missing' %>"
  public: false
  endpoint: "<%= ENV['QUL_STORAGE_ENDPOINT'].presence || 'https://fix.me' %>"
  request_checksum_calculation: when_required
  upload:
    cache_control: "public, max-age=<%= 1.year.to_i %>"

# Database backups (private).
database_backups:
  service: S3
  access_key_id: "<%= ENV['QUL_STORAGE_ACCESS_KEY'].presence || 'missing' %>"
  secret_access_key: "<%= ENV['QUL_STORAGE_ACCESS_KEY_SECRET'].presence || 'missing' %>"
  region: "<%= ENV['QUL_STORAGE_REGION'].presence || 'us-east-1' %>"
  bucket: "<%= ENV['QUL_BACKUPS_BUCKET'].presence || 'missing' %>"
  public: false
  endpoint: "<%= ENV['QUL_STORAGE_ENDPOINT'].presence || 'https://fix.me' %>"
  request_checksum_calculation: when_required
